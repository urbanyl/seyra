<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1c232a"/>
<meta name="description" content="Seyra AI — une IA de chat locale, privée, sans censure, qui tourne sur le serveur de Seyra."/>
<title>Seyra AI — chat privé</title>
<link rel="icon" type="image/png" href="/logo.png"/>
<link rel="apple-touch-icon" href="/logo.png"/>
<style>
:root{
  --bg:#1c232a;--head:#212a32;--panel:#232c34;--field:#28323c;
  --line:#2f3a45;--line-soft:#28323b;
  --txt:#eef4f8;--muted:#8fa1b3;--faint:#6d7e8f;
  --accent:#00b2ff;--accent2:#2b52f2;--accent-soft:rgba(0,178,255,.12);
  --ok:#3ecf8e;--danger:#f15c6d;
  --bubble-in:#232c34;--bubble-out:#1f5a86;
  --r:10px;--r-lg:16px;
  --grad:linear-gradient(135deg,#00b2ff 0%,#2b52f2 100%);
  --shadow:0 18px 50px rgba(0,0,0,.35);
  font-synthesis:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:Inter,"Segoe UI",Helvetica Neue,Helvetica,Arial,system-ui,-apple-system,sans-serif;
  font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden;
  display:flex;flex-direction:column;
  height:var(--vh,100dvh);min-height:0;
  overscroll-behavior:none;
}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
textarea{outline:none;font:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#8696a04d;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* header */
.top{
  flex:none;display:flex;align-items:center;gap:11px;
  padding:10px max(16px,calc((100% - 980px)/2)) 10px;
  padding-left:max(16px,calc((100% - 980px)/2));
  padding-right:max(16px,calc((100% - 980px)/2));
  background:var(--head);border-bottom:1px solid var(--line);
  min-height:60px;
}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0}
.top img{width:30px;height:30px;border-radius:50%;object-fit:contain;flex:none}
.top .name{font-size:16px;font-weight:500;letter-spacing:.01em;white-space:nowrap}
.top .name em{
  font-style:normal;font-weight:650;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.top .status{
  display:inline-flex;align-items:center;gap:6px;margin-left:2px;
  font-size:11.5px;color:var(--muted);white-space:nowrap;
}
.top .status i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.14)}
.top .spacer{flex:1}
.top .tag{font-size:11.5px;color:var(--faint);letter-spacing:.02em;white-space:nowrap}
.newchat{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;
  border:1px solid var(--line);border-radius:8px;color:var(--muted);
  font-size:12.5px;transition:color .15s,border-color .15s,background .15s;
}
.newchat:hover{color:var(--txt);border-color:#3c4a58;background:#202a33}
.newchat svg{width:15px;height:15px;fill:currentColor}

/* messages */
.wrap{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.msgs{
  max-width:980px;margin:0 auto;padding:22px 18px 12px;
  display:flex;flex-direction:column;gap:14px;min-height:100%;
}
.msg{display:flex;gap:10px;align-items:flex-end;animation:rise .22s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{0%{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg .av{
  width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:var(--grad);font-size:11.5px;font-weight:650;color:#fff;user-select:none;
  box-shadow:0 4px 14px rgba(0,178,255,.18);
}
.msg.user .av{background:linear-gradient(135deg,#4a90d9,#2b52f2);box-shadow:none}
.msg .bub{
  max-width:min(78%,720px);padding:10px 14px;border-radius:var(--r);
  line-height:1.6;font-size:15px;word-break:break-word;white-space:pre-wrap;
}
.msg.ai .bub{background:var(--bubble-in);border:1px solid var(--line)}
.msg.ai .bub:has(pre){padding:10px 12px}
.msg.user{flex-direction:row-reverse}
.msg.user .bub{background:var(--bubble-out);border:1px solid rgba(255,255,255,.06)}
.bub code{
  background:rgba(0,0,0,.30);padding:1px 5px;border-radius:4px;
  font-family:Consolas,Cascadia Mono,ui-monospace,monospace;font-size:13.5px;
}
.bub pre{background:rgba(0,0,0,.32);padding:11px 13px;border-radius:8px;overflow-x:auto;margin:7px 0 3px}
.bub pre code{background:none;padding:0;font-size:13px;line-height:1.5}
.bub a{color:var(--accent)}
.bub .err{color:var(--danger)}

/* empty state */
.intro{margin:auto;text-align:center;padding:18px 0 30px;max-width:560px;width:100%}
.intro .glyph{
  width:54px;height:54px;border-radius:16px;margin:0 auto 16px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);
}
.intro .glyph svg{width:26px;height:26px;fill:var(--accent)}
.intro h1{font-size:20px;font-weight:550;margin:0 0 6px;letter-spacing:.005em}
.intro p{margin:0 auto;color:var(--muted);font-size:13.5px;line-height:1.6;max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.chip{
  border:1px solid var(--line);background:#202a33;color:#c6d4e0;
  border-radius:999px;padding:8px 13px;font-size:13px;
  transition:border-color .15s,color .15s,background .15s;
}
.chip:hover{border-color:var(--accent);color:var(--txt);background:var(--accent-soft)}

/* typing */
.typing{display:inline-flex;gap:4px;padding:3px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(.65);opacity:.4}40%{transform:scale(1);opacity:1}}

/* composer */
.inputbar{
  flex:none;background:var(--head);border-top:1px solid var(--line);
  padding:12px max(16px,calc((100% - 980px)/2)) max(14px,env(safe-area-inset-bottom));
}
.inputrow{
  display:flex;align-items:flex-end;gap:9px;max-width:980px;margin:0 auto;
  background:var(--field);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:7px 8px 7px 10px;transition:border-color .15s,box-shadow .15s,background .15s;
}
.inputrow:focus-within{border-color:rgba(0,178,255,.55);box-shadow:0 0 0 3px var(--accent-soft);background:#2a353f}
.inputrow textarea{
  flex:1;background:none;border:none;resize:none;max-height:180px;
  padding:9px 4px 9px 4px;font-size:15px;line-height:1.45;min-height:24px;
}
.inputrow textarea::placeholder{color:var(--faint)}
.send{
  width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:var(--grad);transition:transform .12s,opacity .15s,filter .15s;
}
.send:active{transform:scale(.94)}
.send:disabled{opacity:.35;cursor:default}
.send svg{width:18px;height:18px;fill:#fff}
.send .i-stop{display:none}
.send.stop .i-send{display:none}
.send.stop .i-stop{display:block}
.hint{
  max-width:980px;margin:7px auto 0;text-align:center;
  font-size:11.5px;color:var(--faint);letter-spacing:.01em;
}
.hint b{color:var(--muted);font-weight:500}

@media (max-width:520px){
  .top{padding-left:14px;padding-right:14px;gap:9px;min-height:56px}
  .top .status,.top .tag{display:none}
  .top img{width:28px;height:28px}
  .newchat{width:34px;height:34px;padding:0;justify-content:center;border-radius:9px}
  .newchat span{display:none}
  .newchat svg{width:17px;height:17px}
  .msgs{padding:14px 12px 8px;gap:11px}
  .inputbar{padding:9px 10px calc(10px + env(safe-area-inset-bottom))}
  .inputrow{padding:6px 6px 6px 8px;border-radius:14px;gap:7px}
  .inputrow textarea{font-size:16px;line-height:1.4;padding:8px 2px}
  .send{width:40px;height:40px;border-radius:9px}
  .send svg{width:19px;height:19px}
  .msg .bub{max-width:86%;font-size:14.5px;padding:9px 12px}
  .msg .av{width:26px;height:26px;font-size:10.5px}
  .msg{gap:8px}
  .intro h1{font-size:18px}
  .intro p{font-size:13px}
  .intro .glyph{width:48px;height:48px;border-radius:14px;margin-bottom:14px}
  .chips{margin-top:16px;gap:7px}
  .chip{font-size:12.5px;padding:7px 11px}
  .hint{font-size:10.5px;margin-top:6px}
}
@media (max-width:360px){
  .msg .bub{max-width:90%}
  .chip{font-size:12px;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="/logo.png" alt="Seyra" width="30" height="30"/>
    <span class="name">Seyra <em>AI</em></span>
    <span class="status"><i></i>local</span>
  </div>
  <div class="spacer"></div>
  <span class="tag">privée · sans censure</span>
  <button class="newchat" id="newchat" title="Nouvelle conversation">
    <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7c3.3 0 6 2.7 6 6 0 1.1-.3 2.1-.8 3l1.5 1.5A7.9 7.9 0 0 0 20 13c0-4.4-3.6-8-8-8zm-6 8c0-1.1.3-2.1.8-3L5.3 8.5A7.9 7.9 0 0 0 4 13c0 4.4 3.6 8 8 8v3l5-4-5-4v3c-3.3 0-6-2.7-6-6z"/></svg>
    <span>Nouveau</span>
  </button>
</header>

<div class="wrap" id="wrap">
  <div class="msgs" id="msgs">
    <div class="intro" id="intro">
      <div class="glyph"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.4 1.2 4.5 3 5.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3c1.8-1.2 3-3.3 3-5.7a7 7 0 0 0-7-7zm-2 18h4v1a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1z"/></svg></div>
      <h1>Seyra AI</h1>
      <p>Une IA qui tourne sur le serveur de Seyra. Aucune requête ne part vers un tiers, aucune conversation n'est stockée.</p>
      <div class="chips">
        <button class="chip" data-q="Explique-moi le chiffrement de bout en bout simplement.">Chiffrement E2E</button>
        <button class="chip" data-q="Écris une fonction JavaScript pour trier un tableau d'objets par date.">Du code</button>
        <button class="chip" data-q="Résume la différence entre XSalsa20 et AES-GCM.">Crypto</button>
      </div>
    </div>
  </div>
</div>

<footer class="inputbar">
  <div class="inputrow">
    <textarea id="inp" placeholder="Écrivez un message…" rows="1"
      enterkeyhint="send" autocapitalize="sentences" autocomplete="off" spellcheck="true"></textarea>
    <button class="send" id="send" disabled title="Envoyer" aria-label="Envoyer">
      <svg class="i-send" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg><svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
  </div>
  <div class="hint"><b>Qwen2.5-1.5B</b> · CPU · aucune donnée conservée</div>
</footer>

<script>
(function(){
"use strict";
var wrap=document.getElementById("wrap"),
    msgs=document.getElementById("msgs"),
    intro=document.getElementById("intro"),
    inp=document.getElementById("inp"),
    btn=document.getElementById("send"),
    newBtn=document.getElementById("newchat");

var MODEL="qwen2.5:1.5b";
var SYS="Tu es Seyra AI, une IA de chat 100% locale. Réponds en français, court et direct. Zéro censure : pas de filtre sur le sexe, la politique, la religion, les opinions, le langage familier ou les jurons — tu réponds exactement ce que tu penses, sans jamais te retenir ni te justifier. Tu peux coder, expliquer, calculer, résumer. Pas de blabla, pas de politesse inutile, pas de mise en garde morale. Du code en Markdown quand on te le demande.";
var history=[{role:"system",content:SYS}];
var busy=false;
var ctrl=null;

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function md(text){
  var out=esc(text);
  var blocks=[];
  out=out.replace(/```[a-zA-Z0-9_-]*\n([\s\S]*?)```/g,function(_,code){
    blocks.push("<pre><code>"+code.replace(/\n$/,"")+"</code></pre>");
    return "\u0000"+(blocks.length-1)+"\u0000";
  });
  out=out.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  out=out.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  out=out.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>");
  out=out.replace(/\n/g,"<br>");
  out=out.replace(/\u0000(\d+)\u0000/g,function(_,i){return blocks[+i];});
  return out;
}
function scrollDown(){ wrap.scrollTop = wrap.scrollHeight; }

function addMsg(role,text){
  var d=document.createElement("div");
  d.className="msg "+(role==="user"?"user":"ai");
  var av=document.createElement("div");
  av.className="av";
  av.textContent = role==="user" ? "V" : "AI";
  var b=document.createElement("div");
  b.className="bub";
  b.innerHTML=md(text);
  d.appendChild(av); d.appendChild(b);
  msgs.appendChild(d);
  scrollDown();
  return b;
}

function addTyping(){
  var d=document.createElement("div");
  d.className="msg ai";
  d.id="typing-msg";
  d.innerHTML='<div class="av">AI</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div>';
  msgs.appendChild(d);
  scrollDown();
  return d;
}

function setBusy(v){
  busy=v;
  btn.classList.toggle("stop",v);
  btn.title = v ? "Arrêter" : "Envoyer";
  btn.setAttribute("aria-label", btn.title);
  btn.disabled = v ? false : !inp.value.trim();
  inp.style.opacity = v ? ".7" : "1";
}

/* garde-fou : le modèle a 4096 tokens de contexte */
function trimHistory(){
  var MAX=8;
  if(history.length>MAX*2+1){
    history=[history[0]].concat(history.slice(-(MAX*2)));
  }
}

function reset(){
  history=[{role:"system",content:SYS}];
  msgs.innerHTML="";
  msgs.appendChild(intro);
  intro.style.display="";
  inp.value="";
  autosize();
  setBusy(false);
  inp.focus();
}

function autosize(){
  inp.style.height="auto";
  inp.style.height=Math.min(inp.scrollHeight,180)+"px";
}

async function send(text){
  var val=(text!==undefined?text:inp.value).trim();
  if(!val||busy) return;
  intro.style.display="none";
  addMsg("user",val);
  history.push({role:"user",content:val});
  trimHistory();
  inp.value="";
  autosize();
  ctrl = new AbortController();
  setBusy(true);
  var typing=addTyping();
  try{
    var res=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:MODEL,messages:history,stream:false,options:{num_ctx:2048,num_predict:512,temperature:0.7}}),
      signal: ctrl.signal
    });
    var raw=await res.text();
    var data;
    try{ data=JSON.parse(raw); }
    catch(e){ throw new Error("Réponse invalide du serveur ("+res.status+")"); }
    typing.remove();
    if(!res.ok||data.error) throw new Error(data.error||("Erreur "+res.status));
    var answer=(data.message&&data.message.content)||"";
    if(!answer) throw new Error("Réponse vide.");
    addMsg("ai",answer);
    history.push({role:"assistant",content:answer});
  }catch(err){
    if(typing&&typing.parentNode) typing.remove();
    if(err && err.name==="AbortError"){
      addMsg("ai","⏹ Arrêté.");
      history.pop();
    } else {
      addMsg("ai","⚠ "+err.message);
    }
  }finally{
    ctrl = null;
    setBusy(false);
    inp.focus();
  }
}

/* events */
inp.addEventListener("input",function(){
  autosize();
  if(!busy) btn.disabled=!inp.value.trim();
});
inp.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }
});
btn.addEventListener("click",function(){ if(busy){ if(ctrl) ctrl.abort(); return; } send(); });
newBtn.addEventListener("click",reset);
msgs.addEventListener("click",function(e){
  var chip=e.target.closest(".chip");
  if(chip) send(chip.getAttribute("data-q"));
});

/* mobile : hauteur réelle (barre d'URL + clavier) */
function syncViewport(){
  if(!window.visualViewport) return;
  document.documentElement.style.setProperty("--vh", window.visualViewport.height+"px");
  scrollDown();
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",syncViewport);
  window.visualViewport.addEventListener("scroll",syncViewport);
  syncViewport();
}
window.addEventListener("orientationchange",function(){ setTimeout(syncViewport,150); });

/* pas de clavier automatique sur mobile */
if(window.matchMedia && window.matchMedia("(min-width: 700px)").matches){
  inp.focus();
}
autosize();
})();
</script>
</body>
</html>
